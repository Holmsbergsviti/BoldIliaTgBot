services:
  - type: web
    name: boldilia-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false       # paste your Telegram bot token in Render dashboard
      - key: DATABASE_URL
        sync: false       # paste your Supabase connection string in Render dashboard
      - key: WEBHOOK_URL
        sync: false       # paste your Render service URL, e.g. https://boldilia-bot.onrender.com
