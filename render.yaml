services:
  - type: web
    name: boldilia-bot
    runtime: python
    pythonVersion: "3.12.0"
    buildCommand: pip install --no-cache-dir "python-telegram-bot==21.6" "python-dotenv==1.0.1" "psycopg2-binary==2.9.9"
    startCommand: python3 bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEBHOOK_URL
        sync: false
