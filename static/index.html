<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bald Ilia 💈</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg:     var(--tg-theme-bg-color, #1a1a2e);
    --sec:    var(--tg-theme-secondary-bg-color, #16213e);
    --text:   var(--tg-theme-text-color, #eee);
    --hint:   var(--tg-theme-hint-color, #aaa);
    --btn:    var(--tg-theme-button-color, #e94560);
    --btnTxt: var(--tg-theme-button-text-color, #fff);
    --link:   var(--tg-theme-link-color, #e94560);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 16px;
  }

  /* Lang toggle */
  .lang-bar { display: flex; justify-content: flex-end; margin-bottom: 12px; }
  .lang-btn {
    background: var(--sec); border: none; color: var(--hint);
    border-radius: 20px; padding: 5px 14px; font-size: .8rem; cursor: pointer;
    transition: color .2s, background .2s;
  }
  .lang-btn.active { background: var(--btn); color: var(--btnTxt); }

  h1 { font-size: 1.6rem; text-align: center; margin-bottom: 4px; }
  .sub { text-align: center; color: var(--hint); font-size: .85rem; margin-bottom: 20px; }

  /* Progress */
  .card { background: var(--sec); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  .prog-label { display: flex; justify-content: space-between; font-size: .85rem; color: var(--hint); margin-bottom: 8px; }
  .prog-wrap { background: rgba(255,255,255,.1); border-radius: 999px; height: 18px; overflow: hidden; }
  .prog-bar {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, #e94560, #f5a623);
    width: 0%; transition: width 1s cubic-bezier(.4,0,.2,1);
  }
  .prog-bar.glow { box-shadow: 0 0 14px #e94560cc; }
  .prog-total { text-align: center; font-size: 1.8rem; font-weight: 700; margin: 10px 0 2px; }
  .prog-goal  { text-align: center; color: var(--hint); font-size: .8rem; }
  .goal-badge {
    text-align: center; margin-top: 10px; font-size: 1.1rem; font-weight: 600;
    color: #f5a623; display: none;
  }
  .donors-line { text-align: center; font-size: .8rem; color: var(--hint); margin-top: 6px; }

  /* Countdown */
  .countdown { display: flex; justify-content: center; gap: 12px; }
  .cd-unit { text-align: center; }
  .cd-val {
    background: var(--btn); color: var(--btnTxt);
    border-radius: 10px; padding: 8px 14px;
    font-size: 1.5rem; font-weight: 700; min-width: 56px; display: block;
    transition: transform .15s;
  }
  .cd-val.bump { animation: bump .25s ease; }
  @keyframes bump { 0%{transform:scale(1)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }
  .cd-lbl { font-size: .65rem; color: var(--hint); margin-top: 4px; }

  /* Pledge */
  .amounts { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 12px; }
  .amt-btn {
    background: var(--bg); border: 2px solid rgba(255,255,255,.15);
    border-radius: 12px; color: var(--text);
    padding: 10px 4px; font-size: .9rem; cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  .amt-btn:hover, .amt-btn.sel {
    border-color: var(--btn); background: color-mix(in srgb, var(--btn) 20%, transparent);
  }
  .custom-wrap { display: flex; gap: 8px; margin-bottom: 12px; }
  .custom-wrap input {
    flex: 1; background: var(--bg); border: 2px solid rgba(255,255,255,.15);
    border-radius: 12px; color: var(--text); padding: 10px 14px; font-size: .9rem;
    outline: none;
  }
  .custom-wrap input:focus { border-color: var(--btn); }
  .pledge-btn {
    width: 100%; background: var(--btn); color: var(--btnTxt);
    border: none; border-radius: 12px; padding: 14px;
    font-size: 1rem; font-weight: 600; cursor: pointer;
    transition: opacity .2s, transform .1s;
  }
  .pledge-btn:active { transform: scale(.98); }
  .pledge-btn:disabled { opacity: .5; cursor: default; }
  .my-pledge {
    text-align: center; margin-top: 12px; font-size: .85rem; color: var(--hint);
  }
  .remove-link {
    color: var(--link); cursor: pointer; text-decoration: underline; margin-left: 6px;
  }

  /* Leaderboard */
  .lb-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.06);
    animation: fadeIn .4s ease;
  }
  .lb-row:last-child { border-bottom: none; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  .lb-rank { font-size: .9rem; font-weight: 700; min-width: 22px; color: var(--hint); }
  .lb-name { flex: 1; font-size: .9rem; }
  .lb-amt  { font-size: .9rem; font-weight: 600; color: var(--link); }

  /* Toast */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: #222; color: #fff; padding: 10px 20px; border-radius: 20px;
    font-size: .9rem; transition: transform .3s; z-index: 999; pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  section h2 { font-size: 1rem; font-weight: 600; margin-bottom: 12px; color: var(--hint); text-transform: uppercase; letter-spacing: .06em; }
</style>
</head>
<body>

<div class="lang-bar">
  <button class="lang-btn active" id="btnEN" onclick="setLang('en')">EN</button>
  <button class="lang-btn" id="btnRU" onclick="setLang('ru')" style="margin-left:6px">RU</button>
</div>

<h1>💈 <span data-i="title"></span></h1>
<p class="sub" data-i="sub"></p>

<!-- Progress -->
<div class="card">
  <div class="prog-label">
    <span data-i="progress"></span>
    <span id="pct">0%</span>
  </div>
  <div class="prog-wrap"><div class="prog-bar" id="progBar"></div></div>
  <div class="prog-total" id="totalAmt">0 RSD</div>
  <div class="prog-goal" data-i="goal_line"></div>
  <div class="goal-badge" id="goalBadge" data-i="goal_reached"></div>
  <p class="donors-line" id="donorLine"></p>
</div>

<!-- Countdown -->
<div class="card">
  <section>
    <h2 data-i="time_left"></h2>
    <div class="countdown">
      <div class="cd-unit"><span class="cd-val" id="cdD">--</span><div class="cd-lbl" data-i="days"></div></div>
      <div class="cd-unit"><span class="cd-val" id="cdH">--</span><div class="cd-lbl" data-i="hrs"></div></div>
      <div class="cd-unit"><span class="cd-val" id="cdM">--</span><div class="cd-lbl" data-i="min"></div></div>
      <div class="cd-unit"><span class="cd-val" id="cdS">--</span><div class="cd-lbl" data-i="sec"></div></div>
    </div>
  </section>
</div>

<!-- Pledge -->
<div class="card">
  <section>
    <h2 data-i="pledge_heading"></h2>
    <div class="amounts">
      <button class="amt-btn" data-v="500">500 RSD</button>
      <button class="amt-btn" data-v="1000">1,000 RSD</button>
      <button class="amt-btn" data-v="3000">3,000 RSD</button>
      <button class="amt-btn" data-v="5000">5,000 RSD</button>
      <button class="amt-btn" data-v="10000">10,000 RSD</button>
      <button class="amt-btn" data-v="15000">15,000 RSD</button>
    </div>
    <div class="custom-wrap">
      <input type="number" id="customAmt" min="50"/>
    </div>
    <button class="pledge-btn" id="pledgeBtn" disabled data-i="pledge_btn"></button>
    <div class="my-pledge" id="myPledge"></div>
  </section>
</div>

<!-- Leaderboard -->
<div class="card">
  <section>
    <h2 data-i="leaderboard"></h2>
    <div id="leaderboard"></div>
  </section>
</div>

<div id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
tg?.expand();
const initData = tg?.initData || "";

const GOAL = 30000;
const DEADLINE = new Date("2026-08-29T00:00:00Z");

// ── i18n ───────────────────────────────────────────────────────────────────
const T = {
  en: {
    title:         "Bald Ilia",
    sub:           "Help us shave Ilia's head by August 29, 2026!",
    progress:      "Progress",
    goal_line:     "Goal: 30,000 RSD",
    goal_reached:  "🎉 Goal reached! Ilia is going bald!",
    time_left:     "Time Left",
    days: "DAYS", hrs: "HRS", min: "MIN", sec: "SEC",
    pledge_heading: "Pledge",
    custom_placeholder: "Custom amount (RSD)",
    pledge_btn:    "Pledge",
    pledging:      "Pledging…",
    saved:         "🎉 Pledge saved!",
    removed:       "Pledge removed",
    net_err:       "Network error",
    confirm_remove:"Remove your pledge?",
    your_pledge:   "Your pledge:",
    remove:        "Remove",
    leaderboard:   "Leaderboard 🏆",
    no_pledges:    "No pledges yet. Be the first!",
    donors_one:    "donor",
    donors_many:   "donors",
  },
  ru: {
    title:         "Лысый Илья",
    sub:           "Поможем обрить Илью до 29 августа 2026!",
    progress:      "Прогресс",
    goal_line:     "Цель: 30 000 RSD",
    goal_reached:  "🎉 Цель достигнута! Илья идёт бриться!",
    time_left:     "Осталось времени",
    days: "ДН", hrs: "ЧАС", min: "МИН", sec: "СЕК",
    pledge_heading: "Пожертвовать",
    custom_placeholder: "Своя сумма (RSD)",
    pledge_btn:    "Пожертвовать",
    pledging:      "Отправляем…",
    saved:         "🎉 Пожертвование сохранено!",
    removed:       "Пожертвование удалено",
    net_err:       "Ошибка сети",
    confirm_remove:"Удалить пожертвование?",
    your_pledge:   "Ваше пожертвование:",
    remove:        "Удалить",
    leaderboard:   "Таблица лидеров 🏆",
    no_pledges:    "Пока нет пожертвований. Будь первым!",
    donors_one:    "участник",
    donors_many:   "участников",
  },
};

// Auto-detect from Telegram language code
const tgLang = tg?.initDataUnsafe?.user?.language_code || navigator.language || "en";
let lang = tgLang.startsWith("ru") ? "ru" : "en";

function t(key) { return T[lang][key] || T.en[key] || key; }

function setLang(l) {
  lang = l;
  localStorage.setItem("lang", l);
  document.getElementById("btnEN").classList.toggle("active", l === "en");
  document.getElementById("btnRU").classList.toggle("active", l === "ru");
  document.querySelectorAll("[data-i]").forEach(el => {
    el.textContent = t(el.dataset.i);
  });
  document.getElementById("customAmt").placeholder = t("custom_placeholder");
  document.getElementById("pledgeBtn").textContent = t("pledge_btn");
  updateDonorLine(lastDonors);
  renderMyPledge(lastMyPledge);
  loadLeaderboard();
}

// ── Amount picker ──────────────────────────────────────────────────────────
let selectedAmt = null;
document.querySelectorAll(".amt-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".amt-btn").forEach(b => b.classList.remove("sel"));
    btn.classList.add("sel");
    selectedAmt = parseInt(btn.dataset.v);
    document.getElementById("customAmt").value = "";
    updatePledgeBtn();
  });
});
document.getElementById("customAmt").addEventListener("input", e => {
  document.querySelectorAll(".amt-btn").forEach(b => b.classList.remove("sel"));
  selectedAmt = parseInt(e.target.value) || null;
  updatePledgeBtn();
});
function updatePledgeBtn() {
  const btn = document.getElementById("pledgeBtn");
  btn.disabled = !(selectedAmt && selectedAmt >= 50);
}

// ── Pledge ─────────────────────────────────────────────────────────────────
document.getElementById("pledgeBtn").addEventListener("click", async () => {
  if (!selectedAmt || selectedAmt < 50) return;
  const btn = document.getElementById("pledgeBtn");
  btn.disabled = true;
  btn.textContent = t("pledging");
  try {
    const res = await fetch("/api/pledge", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({initData, amount: selectedAmt}),
    });
    const data = await res.json();
    if (data.ok) {
      tg?.HapticFeedback?.notificationOccurred("success");
      toast(t("saved"));
      updateProgress(data.total, data.donors, data.goal_reached);
      renderMyPledge(selectedAmt);
    } else {
      toast(data.error || "Error");
    }
  } catch { toast(t("net_err")); }
  btn.textContent = t("pledge_btn");
  updatePledgeBtn();
  loadLeaderboard();
});

// ── Remove pledge ──────────────────────────────────────────────────────────
let lastMyPledge = null;
async function removePledge() {
  const ok = await new Promise(r => {
    if (tg) tg.showConfirm(t("confirm_remove"), r);
    else r(confirm(t("confirm_remove")));
  });
  if (!ok) return;
  try {
    const res = await fetch("/api/remove-pledge", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({initData}),
    });
    const data = await res.json();
    if (data.ok) {
      tg?.HapticFeedback?.notificationOccurred("warning");
      toast(t("removed"));
      lastMyPledge = null;
      document.getElementById("myPledge").innerHTML = "";
      loadStatus();
      loadLeaderboard();
    }
  } catch { toast(t("net_err")); }
}

function renderMyPledge(amount) {
  lastMyPledge = amount;
  if (!amount) { document.getElementById("myPledge").innerHTML = ""; return; }
  document.getElementById("myPledge").innerHTML =
    `${t("your_pledge")} <strong>${amount.toLocaleString()} RSD</strong>`
    + `<span class="remove-link" onclick="removePledge()"> ${t("remove")}</span>`;
}

// ── Progress ───────────────────────────────────────────────────────────────
let lastDonors = null;
function updateDonorLine(donors) {
  lastDonors = donors;
  if (donors == null) return;
  const word = (lang === "ru")
    ? (donors === 1 ? T.ru.donors_one : T.ru.donors_many)
    : (donors === 1 ? T.en.donors_one : T.en.donors_many);
  document.getElementById("donorLine").textContent = `${donors} ${word}`;
}

function updateProgress(total, donors, goalReached) {
  const pct = Math.min(total / GOAL * 100, 100);
  const bar = document.getElementById("progBar");
  bar.style.width = pct + "%";
  bar.classList.toggle("glow", pct >= 100);
  document.getElementById("pct").textContent = (total / GOAL * 100).toFixed(1) + "%";
  document.getElementById("totalAmt").textContent = total.toLocaleString() + " RSD";
  document.getElementById("goalBadge").style.display = goalReached ? "block" : "none";
  updateDonorLine(donors);
}

async function loadStatus() {
  try {
    const data = await (await fetch("/api/status")).json();
    updateProgress(data.total, data.donors, data.goal_reached);
  } catch {}
}

async function loadMyPledge() {
  if (!initData) return;
  try {
    const url = `/api/my-pledge?initData=${encodeURIComponent(initData)}`;
    const data = await (await fetch(url)).json();
    if (data.amount) renderMyPledge(data.amount);
  } catch {}
}

// ── Leaderboard ────────────────────────────────────────────────────────────
async function loadLeaderboard() {
  try {
    const rows = await (await fetch("/api/leaderboard")).json();
    const medals = ["🥇","🥈","🥉"];
    const lb = document.getElementById("leaderboard");
    lb.innerHTML = "";
    if (!rows.length) {
      lb.innerHTML = `<p style="text-align:center;color:var(--hint)">${t("no_pledges")}</p>`;
      return;
    }
    rows.forEach((r, i) => {
      const div = document.createElement("div");
      div.className = "lb-row";
      const name = r.name || (r.username ? "@"+r.username : "—");
      div.innerHTML = `<span class="lb-rank">${medals[i] || (i+1)}</span>`
        + `<span class="lb-name">${escHtml(name)}</span>`
        + `<span class="lb-amt">${r.amount.toLocaleString()} RSD</span>`;
      lb.appendChild(div);
    });
  } catch {}
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ── Countdown ─────────────────────────────────────────────────────────────
const cdEls = {D:"cdD", H:"cdH", M:"cdM", S:"cdS"};
const prevVals = {};
function tickCountdown() {
  const diff = Math.max(0, Math.floor((DEADLINE - Date.now()) / 1000));
  const d = Math.floor(diff / 86400);
  const h = Math.floor(diff % 86400 / 3600);
  const m = Math.floor(diff % 3600 / 60);
  const s = diff % 60;
  [["D",d],["H",h],["M",m],["S",s]].forEach(([k,v]) => {
    const el = document.getElementById(cdEls[k]);
    const str = String(v).padStart(2,"0");
    if (prevVals[k] !== str) {
      el.textContent = str;
      el.classList.remove("bump");
      void el.offsetWidth;
      el.classList.add("bump");
      prevVals[k] = str;
    }
  });
}
setInterval(tickCountdown, 1000);
tickCountdown();

// ── Toast ──────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2500);
}

// ── Init ───────────────────────────────────────────────────────────────────
const savedLang = localStorage.getItem("lang");
if (savedLang) lang = savedLang;
setLang(lang);
loadStatus();
loadMyPledge();
setInterval(loadStatus, 10000);
</script>
</body>
</html>
